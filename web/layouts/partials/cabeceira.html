<header class="cabeceira">
  <div class="envoltorio cabeceira-fila">
    <a class="marca" href="{{ "" | relURL }}" aria-label="{{ site.Title }}, inicio">
      {{ partial "logo.html" . }}
      <span class="marca-texto">Calculín <span>Traducións</span></span>
    </a>
    <nav class="menu" aria-label="Principal">
      <a href="{{ "xogos/" | relURL }}"{{ if eq .Section "xogos" }} aria-current="page"{{ end }}>Xogos</a>
      <a href="{{ "como-parchear/" | relURL }}"{{ if eq .RelPermalink ("como-parchear/" | relURL) }} aria-current="page"{{ end }}>Como parchear</a>
      <a href="{{ "sobre/" | relURL }}"{{ if eq .RelPermalink ("sobre/" | relURL) }} aria-current="page"{{ end }}>O proxecto</a>
    </nav>
    <div class="cabeceira-accions">
      <a class="boton-icona" href="{{ site.Params.repo }}" aria-label="O proxecto en GitHub" title="O proxecto en GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button class="boton-icona" type="button" data-cambiar-tema aria-label="Cambiar entre tema claro e escuro" title="Tema claro / escuro">
        <svg class="icona-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
        <svg class="icona-lua" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
      </button>
    </div>
  </div>
</header>
